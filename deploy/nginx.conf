server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/tourism-review-llm-evaluation/site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
