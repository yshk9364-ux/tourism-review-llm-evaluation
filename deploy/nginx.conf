server {
    listen 80;
    listen [::]:80;
    server_name 43.136.59.87 127.0.0.1 localhost;

    root /var/www/tourism-review-llm-evaluation/site;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/tourism-review-ai.access.log;
    error_log /var/log/nginx/tourism-review-ai.error.log;
}
